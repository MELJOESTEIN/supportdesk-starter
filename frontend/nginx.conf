# nginx sert l'application construite ET relaie l'API.
#
# Conséquence directe : en production, le front et l'API partagent la même origine, donc
# **CORS ne s'applique plus**. C'est le piège du J4 — une configuration CORS bricolée en
# développement disparaît du problème dès qu'on sert les deux depuis le même hôte.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité. Ils ne coûtent rien et ferment des classes entières d'attaques.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 'unsafe-inline' sur les styles : Angular injecte les styles de composants en ligne.
    # connect-src autorise l'API (même origine) et Keycloak, et rien d'autre.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8081; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;
    gzip_min_length 1024;

    # Les fichiers d'Angular portent une empreinte dans leur nom : ils sont immuables.
    location ~* \.(js|css|woff2|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Forwarded-* est RÉÉCRIT, jamais relayé : un en-tête entrant sous ce nom est
        # fourni par le client, donc il ne mérite aucune confiance.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization passe tel quel. Le proxy ne termine aucune session, ne réécrit
        # aucun jeton : il ne doit pas devenir un contournement de l'autorisation.
        proxy_read_timeout 30s;
    }

    location /graphql {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Application à page unique : toute route inconnue rend index.html, et c'est le routeur
    # Angular qui décide. Sans ça, un rechargement sur /agent/file donne un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
